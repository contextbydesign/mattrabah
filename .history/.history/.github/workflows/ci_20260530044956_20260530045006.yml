name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci --prefer-offline --no-audit
      - name: Type-check
        run: npx -y tsc --noEmit
      - name: Build
        run: npm run build --if-present
      - name: Test build output exists
        run: |
          if [ ! -d "dist" ]; then echo "dist missing" && exit 1; fi
      - name: Start static server for Lighthouse
        run: |
          npx http-server ./dist -p 8080 --silent &
          # wait for server to respond (retry up to ~24s)
          for i in 1 12; do
            if curl -sSf http://127.0.0.1:8080 >/dev/null; then
              echo "static server is up"
              break
            fi
            echo "waiting for server ($i/12)..."
            sleep 2
          done
          if ! curl -sSf http://127.0.0.1:8080 >/dev/null; then
            echo "server failed to start" && exit 1
          fi
      - name: Run Lighthouse and save JSON
        run: |
          # try Lighthouse up to 3 times with backoff in case Chrome or server isn't ready
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Lighthouse attempt $attempt"
            npx -y lighthouse http://127.0.0.1:8080 --output=json --output-path=./lighthouse-report.json --chrome-flags="--headless --no-sandbox" && break
            echo "Lighthouse failed on attempt $attempt"
            sleep $((attempt * 5))
          done
          if [ ! -f ./lighthouse-report.json ]; then
            echo "Lighthouse did not produce a report" && exit 1
          fi
      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.json
