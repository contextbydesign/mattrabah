name: Validate frontmatter

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  validate-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      name: Frontmatter Validation

      on:
        push:
          branches:
            - main
        pull_request:
          branches:
            - main
        workflow_dispatch: {}

      jobs:
        frontmatter:
          name: Check frontmatter
          runs-on: ubuntu-latest
          steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Use Node.js 22
              uses: actions/setup-node@v4
              with:
                node-version: '22.x'
                cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run frontmatter validator
              run: npm run check-frontmatter
